services:
  - type: web
    name: sound-doodles
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false # set to your public https URL, e.g. https://sound-doodles.onrender.com
      - key: ROOM_TTL_MINUTES
        value: "120"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
