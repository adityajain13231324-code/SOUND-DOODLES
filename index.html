<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e1b" />
    <meta
      name="description"
      content="A very unserious game for your very best voices. Make sounds, guess your friends, and see where the story goes."
    />
    <title>Sound Doodles • Make some noise.</title>
    <script>
      // Apply the saved theme and motion preference before first paint so nothing flashes.
      try {
        var d = document.documentElement;
        var t = localStorage.getItem("sd-theme");
        if (t) d.dataset.theme = t;
        if (localStorage.getItem("sd-reduce-motion") === "1") d.dataset.motion = "reduce";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
